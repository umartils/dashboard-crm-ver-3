# Compose aplikasi (backend + frontend).
# Database ada di docker-compose.db.yml dan harus sudah jalan.
name: rfm-app

services:
  backend:
    build:
      context: ./backend
    container_name: rfm-backend-new
    restart: unless-stopped

    environment:
      APP_ENV: ${APP_ENV}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      # Host = nama container MySQL, port = port internal (3306)
      DASHBOARD_DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@rfm-dashboard-db-new:3306/${MYSQL_DATABASE}
      SOURCE_DATABASE_URL: ${SOURCE_DATABASE_URL}
      RFM_CRON_HOUR: ${RFM_CRON_HOUR}
      RFM_CRON_MINUTE: ${RFM_CRON_MINUTE}
      CORS_ORIGINS: ${CORS_ORIGINS}

    # Tidak ada "ports": backend hanya bisa diakses frontend lewat network internal
    networks:
      - dashboard_net

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* dibaca saat build, bukan saat runtime
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}

    container_name: rfm-frontend-new
    restart: unless-stopped

    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      ALLOWED_GOOGLE_DOMAINS: ${ALLOWED_GOOGLE_DOMAINS}
      ALLOWED_GOOGLE_EMAILS: ${ALLOWED_GOOGLE_EMAILS}
      BACKEND_URL: ${BACKEND_URL}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST}
      AUTH_URL: ${AUTH_URL}

    # Hanya untuk Nginx di VPS yang sama
    ports:
      - "127.0.0.1:3001:3000"

    depends_on:
      - backend

    networks:
      - dashboard_net

networks:
  dashboard_net:
    external: true
